name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Lint
        run: npm run lint
      - name: Server tests
        run: node --test server.test.mjs

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright + Chromium
        run: |
          npm i -g playwright@1
          playwright install --with-deps chromium
      - name: Browser smoke check
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node scripts/smoke-e2e.cjs
